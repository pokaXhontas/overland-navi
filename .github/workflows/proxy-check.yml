name: Proxy prüfen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download-Bereich „wanderwege“ anlegen und Testdatei ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wanderwege -R ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create wanderwege -R ${{ github.repository }} --title "Wanderwege" --notes "Wanderwege-Kartendateien für die App (werden automatisch erneuert)."
          echo '{"test":true}' > test.json
          gh release upload wanderwege test.json -R ${{ github.repository }} --clobber
      - name: Karte und Wanderwege über den Proxy abrufen
        run: |
          P=https://ovl-karte.y3m.workers.dev
          for d in $(seq 0 14); do D=$(date -u -d "-$d day" +%Y%m%d); if curl -sfI "https://build.protomaps.com/$D.pmtiles" > /dev/null; then break; fi; done
          echo "== Karte $D"; curl -s -D - -o /dev/null -H "Range: bytes=0-99" -H "Origin: https://pokaxhontas.github.io" "$P/$D.pmtiles" | grep -iE "^HTTP|access-control-allow-origin|content-range"
          echo "== Wanderwege (Testdatei)"; curl -sL -D /tmp/h -H "Origin: https://pokaxhontas.github.io" "$P/wander/test.json"; echo; grep -iE "^HTTP|access-control-allow-origin" /tmp/h
      - name: OpenStreetMap-Abfragedienste (Overpass) erreichbar?
        run: |
          q='data=[out:json][timeout:20];nwr["amenity"="atm"](around:3000,42.875,74.59);out center tags 3;'
          for ua in "overland-navi/1.0 (+https://github.com/pokaXhontas/overland-navi)" "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"; do
            for u in https://overpass-api.de https://overpass.private.coffee https://maps.mail.ru/osm/tools/overpass; do
              echo "== $u | $ua"
              curl -s -m 30 -o /tmp/o -w "HTTP %{http_code} in %{time_total}s\n" "$u/api/interpreter" -A "$ua" --data-urlencode "$q" || true
              head -c 160 /tmp/o 2>/dev/null; echo
            done
          done
          echo "== Proxy /overpass"
          curl -s -m 40 -o /tmp/o -w "HTTP %{http_code} in %{time_total}s\n" "https://ovl-karte.y3m.workers.dev/overpass" -H "Origin: https://pokaxhontas.github.io" --data-urlencode "$q" || true
          head -c 160 /tmp/o 2>/dev/null; echo
