name: Länderliste bauen

on:
  workflow_dispatch:
  schedule:
    # einmal im Monat Grenzen und Downloadgrößen erneuern
    - cron: '17 2 3 * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: countries
  cancel-in-progress: false

jobs:
  countries:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O pmtiles.tgz
          tar xzf pmtiles.tgz pmtiles
          sudo mv pmtiles /usr/local/bin/
          pip install --quiet shapely

      - name: Aktuellen Protomaps-Stand suchen
        id: build
        run: |
          for i in $(seq 0 21); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then echo "date=$d" >> "$GITHUB_OUTPUT"; echo "Protomaps-Build: $d"; exit 0; fi
          done
          echo "Kein Protomaps-Build gefunden"; exit 1

      - name: Ländergrenzen laden (Natural Earth)
        run: curl -sfL -o /tmp/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson

      - name: Zwischenstand laden
        uses: actions/cache/restore@v4
        with:
          path: countries-cache
          key: countries-${{ github.run_id }}
          restore-keys: countries-

      - name: Länderliste und Downloadgrößen berechnen
        env:
          BUDGET_S: '16000'
        run: python3 scripts/build_countries.py /tmp/countries.geojson "https://build.protomaps.com/${{ steps.build.outputs.date }}.pmtiles" https://download.mapterhorn.com/planet.pmtiles

      - name: Zwischenstand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: countries-cache
          key: countries-${{ github.run_id }}

      - name: Einchecken und App neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pokaXhontas"
          git config user.email "pokaXhontas@users.noreply.github.com"
          git add countries.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Länderliste aktualisiert"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
            gh workflow run deploy.yml --ref main
          fi
          # Zeitbudget aufgebraucht: gleich weitermachen
          if [ -f /tmp/countries-budget ]; then
            gh workflow run countries.yml --ref main
          fi
