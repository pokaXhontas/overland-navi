name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # jeden Montag: aktuellen Kartenstand und Suchindex erneuern
    - cron: '23 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bibliotheken laden (MapLibre, PMTiles, Basemap-Stil, Höhenlinien)
        run: |
          mkdir -p vendor-tmp
          cd vendor-tmp
          npm init -y > /dev/null
          npm install --no-audit --no-fund maplibre-gl@5 pmtiles@4 @protomaps/basemaps@5 maplibre-contour@0.1

      - name: pmtiles-Werkzeug installieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O pmtiles.tgz
          tar xzf pmtiles.tgz pmtiles
          sudo mv pmtiles /usr/local/bin/

      - name: Aktuellen Protomaps-Stand suchen
        id: build
        run: |
          for i in $(seq 0 21); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then echo "date=$d" >> "$GITHUB_OUTPUT"; echo "Protomaps-Build: $d"; exit 0; fi
          done
          echo "Kein Protomaps-Build gefunden"; exit 1

      - name: Ausschneider der App gegen das offizielle Werkzeug testen
        env:
          BASE_URL: https://build.protomaps.com/${{ steps.build.outputs.date }}.pmtiles
          DEM_URL: https://download.mapterhorn.com/planet.pmtiles
        run: |
          set -e
          B=13.35,52.48,13.42,52.53
          pmtiles extract "$BASE_URL" ref-base.pmtiles --bbox=$B --maxzoom=13
          node scripts/test_extract.js "$BASE_URL" ref-base.pmtiles "$B" 13
          pmtiles extract "$DEM_URL" ref-dem.pmtiles --bbox=$B --maxzoom=10
          node scripts/test_extract.js "$DEM_URL" ref-dem.pmtiles "$B" 10

      - name: Zugriff aus dem Browser prüfen (CORS)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: https://build.protomaps.com/${{ steps.build.outputs.date }}.pmtiles
          DEM_URL: https://download.mapterhorn.com/planet.pmtiles
        run: |
          echo "== Inhalt Spiegel"; pmtiles show https://data.source.coop/protomaps/openstreetmap/tiles/v3.pmtiles 2>&1 | grep -iE "version|replication|max zoom|tile type|clustered" | head -12 || true
          echo "== Inhalt Original"; pmtiles show "$BASE_URL" 2>&1 | grep -iE "version|replication|max zoom|tile type|clustered" | head -12 || true
          REL=$(gh release view -R protomaps/go-pmtiles --json assets -q '.assets[0].url' 2>/dev/null || true)
          echo "Release-Datei: $REL"
          for u in "$BASE_URL" "$DEM_URL" https://data.source.coop/protomaps/openstreetmap/tiles/v4.pmtiles https://data.source.coop/protomaps/openstreetmap/tiles/v3.pmtiles "$REL"; do
            echo "== $u"
            curl -sL -D - -o /dev/null -H "Origin: https://pokaxhontas.github.io" -H "Range: bytes=0-99" "$u" | grep -iE "^(HTTP|access-control|content-range|location)" || true
            echo "-- Vorabanfrage"
            curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://pokaxhontas.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$u" | grep -iE "^(HTTP|access-control)" || true
          done

      - name: Kalenderwoche bestimmen
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Größen aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: data-cache
          key: data3-${{ hashFiles('regions.json') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            data3-${{ hashFiles('regions.json') }}-
            data3-

      - name: Downloadgrößen der Länder ermitteln
        env:
          BASE_URL: https://build.protomaps.com/${{ steps.build.outputs.date }}.pmtiles
          DEM_URL: https://download.mapterhorn.com/planet.pmtiles
        run: |
          set -euo pipefail
          mkdir -p data-cache
          python3 - << 'PY'
          import json, os, re, subprocess, hashlib
          regions = json.load(open('regions.json', encoding='utf-8'))
          def size(url, geo, mz):
              p = subprocess.run(['pmtiles', 'extract', url, '/tmp/dry.pmtiles', f'--region={geo}', f'--maxzoom={mz}', '--dry-run'],
                                 capture_output=True, text=True)
              out = p.stdout + p.stderr
              print(out.strip()[-400:] if out.strip() else '(keine Ausgabe)')
              m = re.findall(r'archive size of ([0-9.]+)\s*([kKMGT]?B)', out) or re.findall(r'([0-9.]+)\s*([kMGT]B)', out)
              if not m:
                  return None
              v, u = m[-1]
              return int(float(v) * {'B': 1, 'kB': 1e3, 'KB': 1e3, 'MB': 1e6, 'GB': 1e9, 'TB': 1e12}[u])
          for r in regions:
              tag = hashlib.md5(json.dumps([r['boxes'], r['maxzoom'], r['demMaxzoom']]).encode()).hexdigest()[:8]
              cache = f"data-cache/sizes-{r['id']}-{tag}.json"
              if os.path.exists(cache):
                  continue
              geo = f"/tmp/{r['id']}.geojson"
              polys = [[[[w, s], [e, s], [e, n], [w, n], [w, s]]] for w, s, e, n in r['boxes']]
              json.dump({'type': 'MultiPolygon', 'coordinates': polys}, open(geo, 'w'))
              print('==', r['name'])
              sizes = {'base': size(os.environ['BASE_URL'], geo, r['maxzoom']), 'dem': size(os.environ['DEM_URL'], geo, r['demMaxzoom'])}
              json.dump(sizes, open(cache, 'w'))
          PY

      - name: Schriften und Symbole laden
        run: git clone --depth 1 https://github.com/protomaps/basemaps-assets assets-tmp

      - name: Seite zusammenbauen
        env:
          BUILD_DATE: ${{ steps.build.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p site/vendor site/data
          cp -r app/. site/
          pick() {
            dest="$1"; shift
            for f in "$@"; do
              if [ -f "$f" ]; then cp "$f" "$dest"; echo "ok: $f"; return 0; fi
            done
            echo "Datei nicht gefunden: $*"; exit 1
          }
          N=vendor-tmp/node_modules
          pick site/vendor/maplibre-gl.js  $N/maplibre-gl/dist/maplibre-gl.js
          pick site/vendor/maplibre-gl.css $N/maplibre-gl/dist/maplibre-gl.css
          pick site/vendor/pmtiles.js      $N/pmtiles/dist/pmtiles.js $N/pmtiles/dist/index.js
          pick site/vendor/basemaps.js     $N/@protomaps/basemaps/dist/basemaps.js $N/@protomaps/basemaps/dist/index.js
          pick site/vendor/maplibre-contour.js $N/maplibre-contour/dist/index.min.js $N/maplibre-contour/dist/index.js
          cp -r assets-tmp/fonts site/fonts
          cp -r assets-tmp/sprites site/sprites
          python3 - << 'PY'
          import json, os, shutil, hashlib
          regions = json.load(open('regions.json', encoding='utf-8'))
          build = os.environ['BUILD_DATE']
          for r in regions:
              os.makedirs(f"site/data/{r['id']}", exist_ok=True)
              src = f"search/{r['id']}.json"
              if os.path.exists(src):
                  shutil.copy(src, f"site/data/{r['id']}/search.json")
              else:
                  json.dump({'v': 1, 'complete': False, 'items': []}, open(f"site/data/{r['id']}/search.json", 'w'))
              tag = hashlib.md5(json.dumps([r['boxes'], r['maxzoom'], r['demMaxzoom']]).encode()).hexdigest()[:8]
              sizes = json.load(open(f"data-cache/sizes-{r['id']}-{tag}.json"))
              sizes['search'] = os.path.getsize(f"site/data/{r['id']}/search.json")
              r['sizes'] = sizes
              r['search'] = f"data/{r['id']}/search.json"
              ws, ss, es, ns = zip(*r['boxes'])
              r['bbox'] = [min(ws), min(ss), max(es), max(ns)]
          cfg = json.load(open('config.json')) if os.path.exists('config.json') else {}
          proxy = (cfg.get('baseProxy') or '').rstrip('/')
          out = {
              'build': build,
              'sources': {
                  'base': f'{proxy}/{build}.pmtiles' if proxy else f'https://build.protomaps.com/{build}.pmtiles',
                  'dem': 'https://download.mapterhorn.com/planet.pmtiles'
              },
              'regions': regions
          }
          json.dump(out, open('site/data/regions.json', 'w'), ensure_ascii=False, indent=1)
          for r in regions:
              s = r['sizes']
              print(f"{r['name']:<22} Karte {((s['base'] or 0)/1e6):8.0f} MB  Höhen {((s['dem'] or 0)/1e6):8.0f} MB  Suche {s['search']/1e6:5.1f} MB")
          PY
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" site/sw.js site/index.html
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
