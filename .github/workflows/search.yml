name: Suchindex aktualisieren

on:
  workflow_dispatch:
  schedule:
    # alle 6 Stunden fehlende Abschnitte ergänzen, ältere als 30 Tage erneuern
    - cron: '41 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Zwischenstand laden
        uses: actions/cache/restore@v4
        with:
          path: search-cache
          key: search-${{ github.run_id }}
          restore-keys: search-

      - name: Suchindex bauen, Land für Land einchecken
        env:
          SEARCH_BUDGET_S: '19000'
          CACHE_DIR: search-cache
          OUT_DIR: search
        run: |
          git config user.name "pokaXhontas"
          git config user.email "pokaXhontas@users.noreply.github.com"
          for id in $(jq -r '.[].id' regions.json); do
            python3 scripts/build_search.py "$id"
            git add search
            if ! git diff --cached --quiet; then
              git commit -q -m "Suchindex: $id"
              git pull -q --rebase origin main && git push -q origin HEAD:main || echo "Push fehlgeschlagen, später erneut"
            fi
          done

      - name: Zwischenstand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: search-cache
          key: search-${{ github.run_id }}

      - name: App neu veröffentlichen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
