name: Wanderwege bauen

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Länder (Geofabrik-Kennungen, z. B. switzerland,austria). Leer = alle.'
        required: false
        default: ''
  schedule:
    # alle drei Monate aus frischen OpenStreetMap-Daten
    - cron: '23 2 5 1,4,7,10 *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hiking
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L=$(python3 scripts/hiking_plan.py "${{ github.event.inputs.only }}")
          echo "list=$L" >> "$GITHUB_OUTPUT"
          echo "$L" | python3 -c "import json,sys; l=json.load(sys.stdin); print(len(l), 'Länder')"
          # Länderliste für Ausfälle von Geofabrik im Projekt merken
          if ! git diff --quiet -- scripts/hiking-countries.json 2>/dev/null || [ -n "$(git status --porcelain scripts/hiking-countries.json)" ]; then
            git config user.name pokaXhontas; git config user.email pokaXhontas@users.noreply.github.com
            git add scripts/hiking-countries.json && git commit -qm "Länderliste für Wanderwege aktualisiert" && (git pull -q --rebase origin main; git push -q origin HEAD:main) || true
          fi

  land:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Größe prüfen
        id: size
        run: |
          ALT=$(echo "${{ matrix.url }}" | sed 's#https://download.geofabrik.de/#https://download.openstreetmap.fr/extracts/#')
          S=$( (curl -sfIL --connect-timeout 20 "$ALT" || curl -sfIL --connect-timeout 20 "${{ matrix.url }}") | grep -i '^content-length' | tail -1 | tr -dc '0-9' || true)
          echo "Größe: $((S/1000000)) MB"
          if [ "${S:-0}" -gt 12000000000 ]; then echo "zu groß, übersprungen"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          if [ "${S:-0}" -gt 2500000000 ]; then sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1; fi

      - name: Werkzeuge (osmium, tippecanoe)
        if: steps.size.outputs.skip != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool libsqlite3-dev zlib1g-dev > /dev/null
          pip install --quiet osmium
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -s -C /tmp/tc -j4 > /dev/null && sudo make -s -C /tmp/tc install > /dev/null

      - name: OpenStreetMap-Daten laden (Geofabrik)
        if: steps.size.outputs.skip != '1'
        run: |
          # erst Geofabrik, sonst der Spiegel von OpenStreetMap France (gleiche Pfade)
          ALT=$(echo "${{ matrix.url }}" | sed 's#https://download.geofabrik.de/#https://download.openstreetmap.fr/extracts/#')
          for u in "$ALT" "${{ matrix.url }}" "$ALT"; do
            echo "lade $u"
            if curl -sfL --retry 3 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o land.osm.pbf "$u"; then ls -lh land.osm.pbf; exit 0; fi
            sleep 60
          done
          exit 1

      - name: Wanderwege herausfiltern
        if: steps.size.outputs.skip != '1'
        run: |
          osmium tags-filter land.osm.pbf w/sac_scale w/highway=path,footway,bridleway,steps,via_ferrata,track r/route=hiking,foot -o wege.osm.pbf --overwrite
          rm land.osm.pbf
          python3 scripts/build_hiking.py wege.osm.pbf wege.geojsonseq

      - name: Kartendatei bauen
        if: steps.size.outputs.skip != '1'
        run: |
          tippecanoe -o ${{ matrix.id }}.pmtiles -l wege -Z8 -z14 -P --read-parallel \
            --simplification=6 --drop-densest-as-needed \
            --attribution='© OpenStreetMap-Mitwirkende' -n "Wanderwege ${{ matrix.name }}" --force wege.geojsonseq 2>&1 | tail -2
          ls -lh ${{ matrix.id }}.pmtiles

      - name: In die Downloads legen
        if: steps.size.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wanderwege > /dev/null 2>&1 || gh release create wanderwege --title "Wanderwege" --notes "Wanderwege-Kartendateien für die App (werden automatisch erneuert)."
          for i in 1 2 3; do gh release upload wanderwege ${{ matrix.id }}.pmtiles --clobber && break; sleep 20; done

  liste:
    needs: [plan, land]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Übersicht der Wanderwege-Dateien
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bei einem Teillauf die vollständige Länderliste fürs Aufräumen holen
          python3 scripts/hiking_plan.py > alle.json
          python3 scripts/hiking_index.py ${{ github.repository }} alle.json
          gh release upload wanderwege index.json --clobber -R ${{ github.repository }}
          gh workflow run deploy.yml --ref main -R ${{ github.repository }}
