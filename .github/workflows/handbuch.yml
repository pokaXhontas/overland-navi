name: Handbuch-Bilder erneuern

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Bildschirmfotos der fertigen App (Handy-Format)
        env:
          OVL_CI_KEY: ${{ secrets.OVL_CI_KEY }}
        run: |
          mkdir -p /tmp/pp && (cd /tmp/pp && npm install --no-audit --no-fund puppeteer-core@23 > /dev/null)
          NODE_PATH=/tmp/pp/node_modules timeout 1500 node scripts/manual_shots.js https://pokaxhontas.github.io/overland-navi/ app/handbuch
          ls -la app/handbuch
      - name: Ins Projekt übernehmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name pokaXhontas; git config user.email pokaXhontas@users.noreply.github.com
          git add app/handbuch
          git diff --cached --quiet && exit 0
          git commit -qm "Handbuch: Bildschirmfotos erneuert"
          git pull -q --rebase origin main && git push -q origin HEAD:main
          # Pushes aus Workflows lösen keinen weiteren Lauf aus: Veröffentlichen selbst anstoßen
          gh workflow run deploy.yml --ref main
