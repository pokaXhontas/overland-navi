name: Punkte der Wanderebene prüfen
on:
  workflow_dispatch:
    inputs:
      gebiet: { description: 'Geofabrik-Pfad, z. B. europe/germany/berlin', required: true, default: 'europe/germany/berlin' }
      arten: { description: 'Arten (biwak,huette,wc …)', required: false, default: 'biwak,huette' }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install --quiet osmium
          G="${{ github.event.inputs.gebiet }}"
          curl -sfL --retry 3 -o land.osm.pbf "https://download.openstreetmap.fr/extracts/$G-latest.osm.pbf" || curl -sfL --retry 3 -o land.osm.pbf "https://download.geofabrik.de/$G-latest.osm.pbf"
          osmium tags-filter land.osm.pbf nw/tourism=alpine_hut,wilderness_hut nw/amenity=shelter -o p.osm.pbf
          python3 scripts/check_points.py p.osm.pbf "${{ github.event.inputs.arten }}"
