name: Wanderwege-Übersicht erneuern
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Übersicht neu bauen und hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/hiking_index.py ${{ github.repository }} scripts/hiking-countries.json
          gh release upload wanderwege index.json --clobber -R ${{ github.repository }}
          gh workflow run deploy.yml --ref main -R ${{ github.repository }}
